{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Selección Docente</title>

    <link rel="stylesheet" href="{% static 'css/global.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>

  <body class="login">
    <div class="login__wrapper">
      <div class="login__card">
        <img
          src="{% static 'img/uni.png' %}"
          class="login__logo"
          alt="UNI Logo"
        />
        <h1 class="login__title">Selección Docente</h1>
        <p class="login__subtitle">
          Bienvenido al Sistema de Selección Docente 🎓<br />
          Porfavor ingresa tu correo UNI y contraseña
        </p>
        <form method="POST" class="login__form">

          {% if messages %}
            <div class="alert-error">
              {% for message in messages %}
                {{ message }}
              {% endfor %}
            </div>
          {% endif %}
          
          {% csrf_token %}
          <div class="form-group">
            <label class="required">Correo o DNI</label>
            <input
              type="text"
              name="username"
              placeholder="Ingresa tu correo o DNI"
              required
            />
          </div>
          <div class="form-group form-password">
            <label class="required">Contraseña</label>

            <div class="password-wrapper">
              <input
                type="password"
                name="password"
                id="password"
                placeholder="********"
                required
              />
              <span class="toggle-password" onclick="togglePassword()">👁</span>
            </div>
          </div>
          <div class="form-remember">
            <input type="checkbox" id="remember" />
            <label for="remember">Recordarme</label>
          </div>
          <button class="btn btn-lg btn-block" type="submit">Ingresar</button>
          <a href="#" class="forgot-link">¿Olvidaste tu Contraseña?</a>
      </div>
    </div>
    <script>
      function togglePassword() {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
      }
    </script>
  </body>
</html>
