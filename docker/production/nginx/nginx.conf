user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format detailed_log '$remote_addr - $upstream_http_x_django_user - [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            '$request_time $upstream_response_time '
                            '"$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log detailed_log;

    sendfile on;
    keepalive_timeout 65;

    # ========== SSL (QUITA ESTA SECCIÓN SI AÚN NO TIENES CERTIFICADOS) ==========
    ssl_certificate /etc/letsencrypt/live/yourdomain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;

    # ========== HEADERS ==========
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass_header X-Django-User;

    # ========== UPSTREAM ==========
    upstream app {
        server app:8000;
    }

    # ============================================================
    #  REDIRECCIÓN HTTP → HTTPS  (COMENTAR si no tienes SSL aún)
    # ============================================================
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;

        return 301 https://$server_name$request_uri;
    }

    # ============================================================
    #    SERVIDOR PRINCIPAL DJANGO  (HTTPS)
    # ============================================================
    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;

        client_max_body_size 20M;

        error_log /var/log/nginx/error.log error;

        # ========== STATIC ==========
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ========== ADMIN SUPERSECRET ==========
        location /supersecret {
            proxy_pass http://app;
            access_log /var/log/nginx/admin_access.log detailed_log;
        }

        # ========== DJANGO ==========
        location / {
            proxy_pass http://app;
            access_log /var/log/nginx/app_access.log detailed_log;
            error_log /var/log/nginx/app_error.log error;
        }
    }
}
